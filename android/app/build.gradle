plugins { id 'com.android.application' }
android {
    namespace 'org.aether64.xr'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.aether64.xr'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-fexceptions -frtti' } }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
    buildFeatures { prefab true }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
}
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = 'Aether64-V1.apk' }
}
dependencies { implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.43' }
dependencyLocking { lockAllConfigurations() }
// Release credentials are supplied externally, never checked into the repository.
if (System.getenv('AETHER_KEYSTORE')) {
    android.signingConfigs {
        release {
            storeFile file(System.getenv('AETHER_KEYSTORE'))
            storePassword System.getenv('AETHER_STORE_PASSWORD')
            keyAlias System.getenv('AETHER_KEY_ALIAS')
            keyPassword System.getenv('AETHER_KEY_PASSWORD')
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.release
}
